<div class="flex w-full flex-col">
  <span class="px-2 text-sm font-semibold text-texto-suave">
    {{ etiqueta() }}
  </span>
  <div class="flex h-12 w-full items-center justify-between rounded-full border border-borde p-1">
    <button
      type="button"
      (click)="cambiar(-1)"
      [disabled]="edad() <= min()"
      aria-label="Restar uno"
      class="grid size-10 place-items-center rounded-full text-xl font-bold disabled:opacity-30"
    >−</button>
    <input
      #campo
      [value]="edad()"
      type="text"
      inputmode="numeric"
      [attr.aria-label]="etiqueta()"
      (input)="escribir()"
      (blur)="restaurar()"
      class="w-full min-w-0 bg-transparent text-center font-semibold outline-none"
    />
    <button
      type="button"
      (click)="cambiar(1)"
      [disabled]="edad() >= max()"
      aria-label="Sumar uno"
      class="grid size-10 place-items-center rounded-full text-xl font-bold disabled:opacity-30"
    >+</button>
  </div>
</div>
