<dialog
  #dialogo
  (close)="cerrado.emit()"
  (click)="clicEnFondo($event)"
  class="hoja-inferior m-0 mx-auto mt-auto w-full max-w-xl rounded-t-[36px] border border-b-0 border-borde bg-superficie p-0 text-texto backdrop:bg-black/40"
>
  <div class="flex flex-col gap-4 p-5">
    <div class="mx-auto h-1.5 w-12 rounded-full bg-borde" aria-hidden="true"></div>

    <div class="flex items-center justify-between">
      <h2 class="font-titulo text-2xl font-semibold">{{ titulo() }}</h2>
      <button type="button" (click)="cerrar()" aria-label="Cerrar" class="grid size-10 place-items-center rounded-full bg-fondo">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <ng-content />
  </div>
</dialog>
