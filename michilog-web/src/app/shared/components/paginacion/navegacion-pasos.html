<div class="flex flex-col gap-4">
  @if (error(); as mensaje) {
    <p role="alert" class="text-center text-sm font-semibold text-error">{{ mensaje }}</p>
  }

  @if (total() > 1) {
    <app-indicador-pasos [total]="total()" [actual]="actual()" />
  }

  <div class="flex gap-3">
    @if (!esPrimera()) {
      <button
        type="button"
        (click)="anterior.emit()"
        class="flex h-15 flex-1 items-center justify-center rounded-full border border-borde bg-superficie font-bold"
      >
        Anterior
      </button>
    }

    @if (esUltima()) {
      <button type="submit" class="flex h-15 flex-[2] items-center justify-center gap-2 rounded-full bg-boton font-bold text-boton-texto">
        {{ textoFinal() }}
        <span class="material-symbols-rounded">check</span>
      </button>
    } @else {
      <button
        type="button"
        (click)="siguiente.emit()"
        class="flex h-15 flex-[2] items-center justify-center gap-2 rounded-full bg-boton font-bold text-boton-texto"
      >
        Siguiente
        <span class="material-symbols-rounded">arrow_forward</span>
      </button>
    }
  </div>
</div>
