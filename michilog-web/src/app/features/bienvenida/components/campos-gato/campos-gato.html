<div
  [formGroup]="grupo()"
  class="relative flex flex-col items-center mt-16 gap-4 rounded-[36px] p-3 pt-0 shadow-[0_8px_30px_rgb(0_0_0/0.06)] transition-colors md:gap-5 md:rounded-[40px] md:p-5 md:pt-0"
  [ngClass]="fondos[c.color.value]"
>

  <!-- Número como sello sobre la esquina: no ocupa espacio. Solo con varios gatos. -->
  @if (numero() !== null) {
    <span class="absolute -left-3 -top-3 z-10 flex size-10 items-center justify-center rounded-full border-[3px] border-superficie bg-chip-lavanda font-titulo text-lg font-semibold shadow-sm">
      {{ numero() }}
    </span>
  }

  <!-- Carita centrada -->
  <div class="-mt-16 grid size-40 place-items-center rounded-full bg-superficie shadow-[0_6px_20px_rgb(0_0_0/0.08)]">
    <app-carita-gato class="block size-32" [color]="c.color.value" />
  </div>

  <!-- Colores debajo de la carita -->
  @if (!compacto()) {
    <div class="flex flex-wrap justify-center gap-2" role="radiogroup" aria-label="Color del gato">
      @for (color of colores; track color) {
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="c.color.value === color"
          [attr.aria-label]="color"
          [title]="color"
          (click)="elegirColor(color)"
          [style.background-color]="pelaje[color]"
          class="size-9 rounded-full border-2 shadow-sm"
          [class.border-texto]="c.color.value === color"
          [class.border-borde]="c.color.value !== color"
        ></button>
      }
    </div>
  }

  <!-- Nombre y sexo -->
  <div class="flex w-full flex-col gap-3">
    <label class="flex flex-col gap-1">
      <span class="px-2 text-sm font-semibold text-texto-suave">Nombre</span>
      <input
        formControlName="nombre"
        placeholder="¿Cómo se llama?"
        [attr.aria-invalid]="c.nombre.touched && c.nombre.invalid"
        class="h-12 w-full rounded-full border border-borde bg-fondo px-5 md:bg-superficie"
      />
    </label>

    <div class="grid grid-cols-2 gap-2">
      @for (opcion of sexos; track opcion.valor) {
        <button
          type="button"
          (click)="c.sexo.setValue(opcion.valor)"
          [attr.aria-pressed]="c.sexo.value === opcion.valor"
          [ngClass]="c.sexo.value === opcion.valor ? opcion.clase : 'bg-superficie/70 text-texto-suave'"
          class="flex h-12 items-center justify-center gap-2 rounded-full border border-transparent font-semibold"
        >
          <span class="material-symbols-rounded text-[22px]">{{ opcion.icono }}</span>
          <span>{{ opcion.texto }}</span>
        </button>
      }
    </div>
  </div>

  <!-- Edad: plegada por defecto; abierta si ya tiene valor -->
  @if (edadAbierta() || c.edad.value !== null) {
    <app-campo-edad class="w-full" [control]="c.edad" [max]="maxEdad" [enfocar]="edadAbierta()" />
  } @else {
    <button
      type="button"
      (click)="edadAbierta.set(true)"
      class="flex h-12 w-full items-center justify-center gap-2 rounded-full border border-dashed border-texto-suave/30 bg-superficie/50 font-semibold text-texto-suave"
    >
      <span class="material-symbols-rounded text-[20px]">add</span>
      Agregar edad
    </button>
  }
</div>
