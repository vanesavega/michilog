<div
  [formGroup]="grupo()"
  [class]="fondo()"
  class="relative flex flex-col items-center mt-16 gap-4 rounded-[36px] p-3 pt-0 shadow-[0_8px_30px_rgb(0_0_0/0.06)] md:gap-5 md:rounded-[40px] md:p-5 md:pt-0"
>
  <!-- Número como sello sobre la esquina: no ocupa espacio. Solo con varios gatos. -->
  @if (numero() !== null) {
    <span class="absolute -left-3 -top-3 z-10 flex size-10 items-center justify-center rounded-full border-[3px] border-superficie bg-chip-lavanda font-titulo text-lg font-semibold shadow-sm">
      {{ numero() }}
    </span>
  }

  <!-- Carita centrada: con colores abiertos es un botón que abre el modal de apariencia -->
  @if (!compacto()) {
    <button
      type="button"
      (click)="modal.abrir()"
      aria-label="Cambiar apariencia"
      class="relative -mt-16 grid size-40 place-items-center rounded-full bg-superficie shadow-[0_6px_20px_rgb(0_0_0/0.08)]"
    >
      <app-carita-gato class="block size-32" [apariencia]="c.apariencia.value" />
      <span class="absolute bottom-1 right-1 grid size-9 place-items-center rounded-full bg-boton text-boton-texto">
        <span class="material-symbols-rounded text-[20px]">palette</span>
      </span>
    </button>
    <app-modal-apariencia #modal [apariencia]="c.apariencia.value" (aplicar)="c.apariencia.setValue($event)" />
  } @else {
    <div class="-mt-16 grid size-40 place-items-center rounded-full bg-superficie shadow-[0_6px_20px_rgb(0_0_0/0.08)]">
      <app-carita-gato class="block size-32" [apariencia]="c.apariencia.value" />
    </div>
  }

  <!-- Nombre y sexo -->
  <div class="flex w-full flex-col gap-3">
    <label class="flex flex-col gap-1">
      <span class="px-2 text-sm font-semibold text-texto-suave">Nombre</span>
      <input
        formControlName="nombre"
        placeholder="¿Cómo se llama?"
        [attr.aria-invalid]="c.nombre.touched && c.nombre.invalid"
        class="h-12 w-full rounded-full border border-borde bg-fondo px-5 md:bg-superficie"
      />
    </label>

    <div class="grid grid-cols-2 gap-2">
      @for (opcion of sexos; track opcion.valor) {
        <button
          type="button"
          (click)="c.sexo.setValue(opcion.valor)"
          [attr.aria-pressed]="c.sexo.value === opcion.valor"
          [ngClass]="c.sexo.value === opcion.valor ? opcion.clase : 'bg-superficie/70 text-texto-suave'"
          class="flex h-12 items-center justify-center gap-2 rounded-full border border-transparent font-semibold"
        >
          <span class="material-symbols-rounded text-[22px]">{{ opcion.icono }}</span>
          <span>{{ opcion.texto }}</span>
        </button>
      }
    </div>
  </div>

  <!-- Edad: plegada por defecto; abierta si ya tiene valor -->
  @if (c.edadMeses.value !== null) {
    <div class="relative flex w-full flex-wrap items-end gap-2 rounded-3xl border border-borde bg-superficie/50 p-3">
      <button
        type="button"
        (click)="quitarEdad()"
        aria-label="Quitar edad"
        class="absolute -right-2 -top-2 grid size-7 place-items-center rounded-lg border border-borde bg-fondo text-texto-suave md:bg-superficie"
      >
        <span class="material-symbols-rounded text-[16px]">close</span>
      </button>
      <div class="flex w-full justify-start">
        <div class="flex w-full gap-1 rounded-full bg-texto/5 p-1">
          <button
            type="button"
            (click)="elegirUnAnioOMas()"
            [attr.aria-pressed]="!menorDeUnAnio"
            [ngClass]="menorDeUnAnio ? 'text-texto-suave' : [fondo(), 'text-texto']"
            class="h-8 flex-1 rounded-full px-3 text-sm font-semibold transition-colors"
          >
            1 año o más
          </button>
          <button
            type="button"
            (click)="elegirMenorDeUnAnio()"
            [attr.aria-pressed]="menorDeUnAnio"
            [ngClass]="menorDeUnAnio ? [fondo(), 'text-texto'] : 'text-texto-suave'"
            class="h-8 flex-1 rounded-full px-3 text-sm font-semibold transition-colors"
          >
            Menos de un año
          </button>
        </div>
      </div>
      @if (menorDeUnAnio) {
        <app-campo-edad
          class="w-full"
          etiqueta="Meses"
          [edad]="mesesSueltos"
          [max]="maxMeses"
          (edadCambio)="cambiarMeses($event)"
        />
      } @else {
        <app-campo-edad
          class="min-w-44 flex-3"
          etiqueta="Años"
          [edad]="anios"
          [min]="1"
          [max]="maxEdad"
          [enfocar]="edadAbierta()"
          (edadCambio)="cambiarAnios($event)"
        />
        @if (mesesVisibles) {
          <app-campo-edad
            class="min-w-36 flex-2"
            etiqueta="Meses"
            [edad]="mesesSueltos"
            [max]="maxMeses"
            [enfocar]="mesesAbiertos()"
            (edadCambio)="cambiarMeses($event)"
          />
        } @else {
          <button
            type="button"
            (click)="mesesAbiertos.set(true)"
            class="flex h-12 min-w-36 flex-2 items-center justify-center gap-1 text-sm font-semibold text-texto-suave"
          >
            <span class="material-symbols-rounded text-[18px]">add</span>
            Agregar meses
          </button>
        }
      }
    </div>
  } @else {
    <button
      type="button"
      (click)="abrirEdad()"
      class="flex h-12 w-full items-center justify-center gap-2 rounded-full border border-dashed border-texto-suave/30 bg-superficie/50 font-semibold text-texto-suave"
    >
      <span class="material-symbols-rounded text-[20px]">add</span>
      Agregar edad
    </button>
  }
</div>
