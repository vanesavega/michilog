<form [formGroup]="gato" (ngSubmit)="guardar()" class="pagina-bienvenida">
    <a routerLink="/bienvenida/cuantos" class="flex size-12 items-center justify-center rounded-full border border-borde bg-superficie">
        <span class="material-symbols-rounded">arrow_back</span>
    </a>
    <h1 class="mt-8 font-titulo text-[34px] font-semibold leading-tight">Cuéntanos de tu gato</h1>
    <p class="mt-3 text-texto-suave">Solo el nombre es obligatorio. Elige su color con los círculos.</p>
    <div class="mt-8">
        <app-campos-gato [grupo]="gato" />
    </div>

    <app-navegacion-pasos class="mt-auto pt-6" [total]="1" [actual]="0" [error]="aviso" />
</form>
