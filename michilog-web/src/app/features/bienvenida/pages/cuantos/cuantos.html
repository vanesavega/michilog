<div class="pagina-bienvenida">
  <a routerLink="/bienvenida" class="flex size-12 items-center justify-center rounded-full border border-borde bg-superficie">
    <span class="material-symbols-rounded">arrow_back</span>
  </a>

  <h1 class="mt-8 font-titulo text-[34px] font-semibold leading-tight">¿Cuántos gatos viven contigo?</h1>
  <p class="mt-3 text-texto-suave">Así armamos tu diario a la medida.</p>

  <div class="mt-8 flex flex-col gap-4">
    @for (opcion of opciones; track opcion.valor) {
      <button
        type="button"
        (click)="eleccion.set(opcion.valor)"
        class="flex items-center gap-4 rounded-[36px] border-[3px] bg-superficie p-4 text-left md:bg-fondo"
        [class.border-texto]="eleccion() === opcion.valor"
        [class.border-transparent]="eleccion() !== opcion.valor"
      >
        <span class="flex size-22 shrink-0 items-center justify-center rounded-full bg-chip-menta">
          @for (color of opcion.caritas; track $index) {
            <app-carita-gato class="-mx-1 block size-12" [color]="color" />
          }
        </span>
        <span class="flex-1">
          <span class="block font-titulo text-xl font-semibold">{{ opcion.titulo }}</span>
          <span class="block text-sm text-texto-suave">{{ opcion.descripcion }}</span>
        </span>
        <span class="material-symbols-rounded" [class.icono-lleno]="eleccion() === opcion.valor">
          {{ eleccion() === opcion.valor ? 'check_circle' : 'radio_button_unchecked' }}
        </span>
      </button>
    }
  </div>

  <button
    type="button"
    [disabled]="!eleccion()"
    (click)="continuar()"
    class="mt-4 flex h-15 items-center justify-center gap-2 rounded-full bg-boton font-bold text-boton-texto disabled:opacity-40"
  >
    Continuar
    <span class="material-symbols-rounded">arrow_forward</span>
  </button>
</div>
