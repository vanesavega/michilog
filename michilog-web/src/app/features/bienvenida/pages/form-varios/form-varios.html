<form [formGroup]="formulario" (ngSubmit)="guardar()" class="pagina-bienvenida">
    <a routerLink="/bienvenida/cantidad" class="flex size-12 items-center justify-center rounded-full border border-borde bg-superficie">
        <span class="material-symbols-rounded">arrow_back</span>
    </a>
    <h1 class="mt-6 font-titulo text-[34px] font-semibold leading-tight">Preséntanos a la familia</h1>
    <p class="mt-2 text-texto-suave">Solo el nombre es obligatorio. Elige el color de cada uno con los círculos.</p>
    <div class="mt-6 grid gap-3 lg:grid-cols-2">
        @for (grupo of formulario.controls.gatos.controls; track grupo; let i = $index) {
        <app-campos-gato [grupo]="grupo" [titulo]="'Gato ' + (i + 1)" />
        }
    </div>
    <button type="submit" class="mt-6 flex h-15 items-center justify-center gap-2 rounded-full bg-boton font-bold text-boton-texto">
        Guardar y empezar
        <span class="material-symbols-rounded">check</span>
    </button>
</form>
