<form [formGroup]="formulario" (ngSubmit)="guardar()" class="pagina-bienvenida">
    <a routerLink="/bienvenida/cantidad" class="flex size-12 items-center justify-center rounded-full border border-borde bg-superficie">
        <span class="material-symbols-rounded">arrow_back</span>
    </a>
    <h1 class="mt-6 font-titulo text-[34px] font-semibold leading-tight">Preséntanos a la familia</h1>
    <p class="mt-2 text-texto-suave">
        Solo el nombre es obligatorio.
        @if (cantidad() > 3) {
          Como son varios, pedimos nombre, sexo y edad. Lo demás lo completas después.
        } @else {
          Elige el color de cada uno con los círculos.
        }
    </p>

    <div class="mt-5 grid gap-5 lg:grid-cols-2">
        @for (grupo of gruposPagina; track grupo; let i = $index) {
        <app-campos-gato [grupo]="grupo" [numero]="paginador.inicio() + i + 1" [compacto]="cantidad() > 3" />
        }
    </div>

    <app-navegacion-pasos
      class="mt-auto pt-6"
      [total]="paginador.totalPaginas()"
      [actual]="paginador.pagina()"
      [error]="aviso"
      (anterior)="anterior()"
      (siguiente)="siguiente()"
    />
</form>
