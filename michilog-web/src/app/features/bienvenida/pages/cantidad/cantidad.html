<div class="pagina-bienvenida">
  <a routerLink="/bienvenida/cuantos" class="flex size-12 items-center justify-center rounded-full border border-borde bg-superficie">
    <span class="material-symbols-rounded">arrow_back</span>
  </a>

  <h1 class="mt-8 font-titulo text-[34px] font-semibold leading-tight">¿Cuántos son en la familia?</h1>
  <p class="mt-3 text-texto-suave">Después los presentas a todos en una sola pantalla.</p>

  <div class="flex flex-1 flex-col items-center justify-start gap-7 pt-10">
    <div class="flex items-center gap-5">
      <button type="button" (click)="menos()" class="flex size-15 items-center justify-center rounded-full border border-borde bg-superficie">
        <span class="material-symbols-rounded">remove</span>
      </button>
      <div class="flex size-42 flex-col items-center justify-center rounded-full bg-chip-lavanda">
        <span class="font-titulo text-7xl font-semibold leading-none">{{ cantidad() }}</span>
        <span class="font-bold">gatos</span>
      </div>
      <button type="button" (click)="mas()" class="flex size-15 items-center justify-center rounded-full bg-boton text-boton-texto">
        <span class="material-symbols-rounded">add</span>
      </button>
    </div>

    <div class="flex min-h-24 max-w-72 flex-wrap content-start justify-center gap-2">
      @for (color of caritas(); track $index) {
        <span class="flex size-11 items-center justify-center rounded-full bg-superficie">
          <app-carita-gato class="block size-8" [color]="color" />
        </span>
      }
    </div>
  </div>

  <button
    type="button"
    (click)="continuar()"
    class="flex mt-auto h-15 items-center justify-center gap-2 rounded-full bg-boton font-bold text-boton-texto"
  >
    Continuar
    <span class="material-symbols-rounded">arrow_forward</span>
  </button>
</div>
