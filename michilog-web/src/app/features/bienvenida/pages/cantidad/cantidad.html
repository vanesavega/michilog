<div class="pagina-bienvenida">
  <a routerLink="/bienvenida/cuantos" class="flex size-12 items-center justify-center rounded-full border border-borde bg-superficie">
    <span class="material-symbols-rounded">arrow_back</span>
  </a>

  <h1 class="mt-8 font-titulo text-[34px] font-semibold leading-tight">¿Cuántos son en la familia?</h1>
  <p class="mt-3 text-texto-suave">Después los presentas a todos en una sola pantalla.</p>

  <div class="flex flex-1 flex-col items-center justify-center gap-7 md:gap-10">
    <div class="flex items-center gap-5 md:gap-8">
      <button type="button" (click)="menos()" aria-label="Menos gatos"
        class="flex size-15 shrink-0 items-center justify-center rounded-full border border-borde bg-superficie md:size-18 lg:size-20">
        <span class="material-symbols-rounded text-[28px] md:text-[32px] lg:text-[36px]">remove</span>
      </button>

      <div class="relative grid size-42 shrink-0 place-items-center rounded-full bg-chip-lavanda md:size-52 lg:size-64">
        <span class="-translate-y-3 font-titulo text-7xl font-semibold leading-none md:-translate-y-4 md:text-8xl lg:-translate-y-5 lg:text-9xl">{{ cantidad() }}</span>
        <span class="absolute bottom-7 font-bold md:bottom-9 md:text-lg lg:bottom-11 lg:text-xl">gatos</span>
      </div>

      <button type="button" (click)="mas()" aria-label="Más gatos"
        class="flex size-15 shrink-0 items-center justify-center rounded-full bg-boton text-boton-texto md:size-18 lg:size-20">
        <span class="material-symbols-rounded text-[28px] md:text-[32px] lg:text-[36px]">add</span>
      </button>
    </div>

    <div class="flex min-h-24 max-w-72 flex-wrap content-start justify-center gap-2 md:min-h-28 md:max-w-lg lg:min-h-32">
      @for (apariencia of caritas(); track $index) {
        <span class="flex size-11 items-center justify-center rounded-full bg-superficie md:size-12 lg:size-14">
          <app-carita-gato class="block size-8 md:size-9 lg:size-10" [apariencia]="apariencia" />
        </span>
      }
    </div>
  </div>

  <button
    type="button"
    (click)="continuar()"
    class="flex mt-auto h-15 items-center justify-center gap-2 rounded-full bg-boton font-bold text-boton-texto"
  >
    Continuar
    <span class="material-symbols-rounded">arrow_forward</span>
  </button>
</div>
