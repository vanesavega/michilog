<div class="pagina-bienvenida">
  <app-logo class="md:hidden" />
  <div class="flex flex-1 items-center justify-center py-8 md:hidden">
    <div class="flex size-64 items-center justify-center rounded-full bg-chip-lavanda">
      <app-carita-gato class="block size-44" [apariencia]="apariencia" />
    </div>
  </div>
  <div class="md:my-auto md:max-w-xl">
    <h1 class="font-titulo text-4xl font-semibold md:text-5xl">Hola, humano.</h1>
    <p class="mt-3 text-[17px] leading-relaxed text-texto-suave">
      Michilog es el diario de tus gatos. Anota lo que cambia en su día y te avisamos si algo se sale de lo normal.
    </p>

    <a routerLink="cuantos" class="mt-8 flex h-15 items-center justify-center gap-2 rounded-full bg-boton px-10 font-bold text-boton-texto md:w-fit">
      Empezar
      <span class="material-symbols-rounded">arrow_forward</span>
    </a>
  </div>
</div>
