<div class="marco-bienvenida">
  @if (conIlustracion()) {
    <aside class="hidden w-[40%] shrink-0 flex-col justify-between overflow-hidden rounded-l-[48px] bg-chip-lavanda p-8 md:flex">
      <div class="flex items-center justify-between">
        <app-logo />
        <app-boton-tema />
      </div>

      <div class="flex flex-1 items-center justify-center">
        <img src="ilustraciones/gato-durmiendo.svg" alt="" class="w-full" />
      </div>
    </aside>
  }
  <div class="contenido-bienvenida relative flex flex-1 flex-col overflow-hidden px-6 pb-8 pt-6 md:px-16 md:py-12">
    <!-- Huellitas decorativas: solo en web, detrás del contenido -->
    <span aria-hidden="true" class="huellita pointer-events-none absolute right-[8%] top-[6%] hidden size-14 rotate-12 bg-chip-lavanda md:block"></span>
    <span aria-hidden="true" class="huellita pointer-events-none absolute right-[3%] top-[42%] hidden size-9 -rotate-12 bg-chip-menta md:block"></span>
    <span aria-hidden="true" class="huellita pointer-events-none absolute bottom-[24%] left-[6%] hidden size-12 rotate-6 bg-chip-durazno md:block"></span>
    <span aria-hidden="true" class="huellita pointer-events-none absolute bottom-[5%] right-[16%] hidden size-10 -rotate-6 bg-chip-cielo md:block"></span>
    <span aria-hidden="true" class="huellita pointer-events-none absolute right-[30%] top-[2%] hidden size-7 rotate-[30deg] bg-chip-mantequilla md:block"></span>
    <router-outlet />
  </div>
</div>
