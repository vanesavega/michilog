<!-- Lista de gatos en vertical: la usan el desplegable y el panel de web -->
<ng-template #opciones>
  @for (gato of gatos(); track gato.id) {
    <button
      type="button"
      class="flex w-full items-center gap-3 rounded-full p-2 text-left font-bold"
      [class.bg-chip-lavanda]="gato.id === seleccionadoId()"
      [attr.aria-pressed]="gato.id === seleccionadoId()"
      (click)="seleccionar.emit(gato.id)"
    >
      <span [class]="fondo(gato)" class="grid size-10 shrink-0 place-items-center rounded-full">
        <app-carita-gato class="block size-7" [apariencia]="gato.apariencia" />
      </span>
      <span class="truncate">{{ gato.nombre }}</span>
    </button>
  }
</ng-template>

<div>
  @if (vertical()) {
    <!-- Panel de web: todos los gatos a la vista -->
    <div class="max-h-[calc(100dvh-3rem)] overflow-y-auto rounded-[28px] border border-borde bg-superficie p-3">
      <ng-container *ngTemplateOutlet="opciones" />
    </div>
  } @else if (!desplegable()) {
    <!-- Fila que se desliza con el dedo -->
    <div class="-mx-5 flex snap-x gap-4 overflow-x-auto px-5 py-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
      @for (gato of gatos(); track gato.id) {
        <button
          type="button"
          class="flex shrink-0 snap-start flex-col items-center gap-1.5"
          [attr.aria-pressed]="gato.id === seleccionadoId()"
          (click)="seleccionar.emit(gato.id)"
        >
          <span
            [class]="fondo(gato)"
            class="grid size-16 place-items-center rounded-full ring-offset-2 ring-offset-fondo transition"
            [class.ring-2]="gato.id === seleccionadoId()"
            [class.ring-texto]="gato.id === seleccionadoId()"
            [class.opacity-60]="gato.id !== seleccionadoId()"
          >
            <app-carita-gato class="block size-11" [apariencia]="gato.apariencia" />
          </span>
          <span class="text-sm font-bold" [class.text-texto]="gato.id === seleccionadoId()" [class.text-texto-suave]="gato.id !== seleccionadoId()">
            {{ gato.nombre }}
          </span>
        </button>
      }
    </div>
  } @else {
    <!-- Con muchos gatos: botón con el gato elegido que abre la lista -->
    <button
      type="button"
      popovertarget="lista-gatos"
      class="flex items-center gap-3 rounded-full border border-borde bg-superficie py-1.5 pr-4 pl-1.5"
    >
      @if (seleccionado(); as gato) {
        <span [class]="fondo(gato)" class="grid size-12 place-items-center rounded-full">
          <app-carita-gato class="block size-9" [apariencia]="gato.apariencia" />
        </span>
        <span class="font-titulo text-lg font-semibold text-texto">{{ gato.nombre }}</span>
      }
      <span class="material-symbols-rounded text-texto-suave">expand_more</span>
    </button>

    <div
      #lista
      id="lista-gatos"
      popover
      class="m-auto max-h-96 w-72 overflow-y-auto rounded-[28px] border border-borde bg-superficie p-3 text-texto backdrop:bg-black/20"
      (click)="lista.hidePopover()"
    >
      <ng-container *ngTemplateOutlet="opciones" />
    </div>
  }
</div>
