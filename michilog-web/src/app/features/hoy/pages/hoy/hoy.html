<div class="md:flex md:items-start md:gap-8">
  <div class="flex min-w-0 max-w-2xl flex-1 flex-col gap-4">
    <header class="-mt-2" [class]="variosGatos() ? '-mb-2 md:mb-2' : 'mb-2'">
      <p class="text-sm font-semibold text-texto-suave first-letter:uppercase">{{ fecha }}</p>
    </header>

    @if (variosGatos()) {
      <div class="sticky top-0 z-10 -mx-5 bg-fondo px-5 py-2 md:hidden">
        <app-selector-gatos
          [gatos]="gatosStore.ordenados()"
          [seleccionadoId]="gatosStore.seleccionado()?.id ?? null"
          [desplegable]="muchosGatos()"
          (seleccionar)="gatosStore.seleccionar($event)"
        />
      </div>
    }

    @if (gatosStore.seleccionado(); as gato) {
      <app-tarjeta-gato-hoy [gato]="gato" [estado]="estado()" (verPerfil)="verPerfil(gato.id)" />
      <h2 class="font-titulo text-lg font-semibold text-texto">Anotar ahora</h2>
      <app-botones-anotar [tipos]="tipos" (anotar)="anotar($event)" (detallar)="detallar()" />
      <app-lista-registros [registros]="registrosDeHoy()" (editar)="editar($event.id, $event.campo)" />

      <app-hoja-inferior #hoja [titulo]="tituloHoja()" (cerrado)="hojaCerrada()">
        @if (registroEditando(); as registro) {
          <app-editar-registro [registro]="registro" [campo]="campoEditando()" (guardado)="cerrarHoja()" (cancelar)="cerrarHoja()" />
        }
      </app-hoja-inferior>
    }
  </div>

  <!-- Web: panel flotante a la derecha -->
  @if (variosGatos()) {
    <aside class="sticky top-4 hidden w-56 shrink-0 flex-col gap-3 md:flex">
      <h2 class="px-1 font-titulo text-xl font-semibold text-texto">Tu familia</h2>
      <app-selector-gatos
        [gatos]="gatosStore.ordenados()"
        [seleccionadoId]="gatosStore.seleccionado()?.id ?? null"
        [vertical]="true"
        (seleccionar)="gatosStore.seleccionar($event)"
      />
    </aside>
  }
</div>
